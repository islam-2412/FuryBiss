name: Build Cython IPKs

on:
  push:
    branches:
      - main # لو اسم الفرع بتاعك master غيرها لـ master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Environment & Compilers
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          sudo apt-get install -y gcc gcc-arm-linux-gnueabihf gcc-mipsel-linux-gnu binutils zip python3-pip
          sudo apt-get install -y python3.9-dev python3.10-dev python3.11-dev python3.12-dev python3.13-dev python3.14-dev
          sudo pip3 install cython --break-system-packages

      - name: Run Build Script
        run: |
          sudo python3 build_ipk.py

      - name: Upload Output ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FuryBiss_IPKs_Release
          path: FuryBiss_IPKs.zip
